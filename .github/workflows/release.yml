name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  gate:
    name: Release test gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/tiller-router
      - name: Validate docker-compose.yml
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate hosted override with managed ingress network
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
          TILLER_PLATFORM_ADMIN_USERNAME: ci-platform
          TILLER_PLATFORM_ADMIN_PASSWORD: ci-platform-password
          TILLER_PUBLIC_URL: https://app.example.com
          TILLER_TRUSTED_PROXY: 172.20.0.2/32
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml config >/dev/null
      - name: Validate external proxy network override
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
          TILLER_PLATFORM_ADMIN_USERNAME: ci-platform
          TILLER_PLATFORM_ADMIN_PASSWORD: ci-platform-password
          TILLER_PUBLIC_URL: https://app.example.com
          TILLER_TRUSTED_PROXY: 172.20.0.2/32
          TILLER_INGRESS_NETWORK: ci-proxy-network
          TILLER_INGRESS_NETWORK_EXTERNAL: "true"
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml config >/dev/null

  regressions:
    name: Full container regressions
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Run browser checks
        run: ./tests/browser/run.sh
      - name: Run compatibility checks
        run: ./tests/compatibility/run.sh
      - name: Run read-only runtime checks
        run: ./tests/runtime-readonly.sh
      - name: Run clean-install and restart smoke
        run: ./tests/release-smoke.sh
      - name: Run TLS reverse-proxy smoke
        run: ./tests/reverse-proxy-smoke.sh

  image:
    name: Publish multi-architecture image
    needs: regressions
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set release metadata
        id: release
        shell: bash
        run: |
          # Accepted tags: vX.Y.Z (stable) and vX.Y.Z-(alpha|beta|rc).N (prerelease).
          #
          # Stable releases publish X.Y.Z, vX.Y.Z, X.Y, 'stable' and 'latest'.
          # Prereleases publish their own version tags plus a channel tag
          # ('alpha' for alpha, 'beta' for beta/rc) and never move 'latest' or
          # 'stable', so `:latest` always means the newest stable release.
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            stable=true
            channel=stable
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            stable=false
            minor=""
            if [[ "${BASH_REMATCH[1]}" == alpha ]]; then
              channel=alpha
            else
              channel=beta
            fi
          else
            echo "Refusing malformed release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "stable=$stable"
            echo "channel=$channel"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.channel }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
          flavor: |
            latest=false
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TILLER_VERSION=${{ steps.release.outputs.version }}
            TILLER_COMMIT=${{ github.sha }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          STABLE: ${{ steps.release.outputs.stable }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "Tiller Router $GITHUB_REF_NAME" --verify-tag)
          if [[ "$STABLE" == true ]]; then
            # Stable notes come from the matching CHANGELOG.md section.
            awk -v want="## [$VERSION]" '
              index($0, want) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            if [[ -s release-notes.md ]]; then
              args+=(--notes-file release-notes.md --latest)
            else
              echo "No CHANGELOG.md section for $VERSION; using generated notes." >&2
              args+=(--generate-notes --latest)
            fi
          else
            args+=(--generate-notes --prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
