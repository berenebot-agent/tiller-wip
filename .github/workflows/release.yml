name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  gate:
    name: Release test gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/tiller-router
      - name: Validate docker-compose.yml
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate hosted override with managed ingress network
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
          TILLER_PLATFORM_ADMIN_USERNAME: ci-platform
          TILLER_PLATFORM_ADMIN_PASSWORD: ci-platform-password
          TILLER_PUBLIC_URL: https://app.example.com
          TILLER_TRUSTED_PROXY: 172.20.0.2/32
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml config >/dev/null
      - name: Validate external proxy network override
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
          TILLER_PLATFORM_ADMIN_USERNAME: ci-platform
          TILLER_PLATFORM_ADMIN_PASSWORD: ci-platform-password
          TILLER_PUBLIC_URL: https://app.example.com
          TILLER_TRUSTED_PROXY: 172.20.0.2/32
          TILLER_INGRESS_NETWORK: ci-proxy-network
          TILLER_INGRESS_NETWORK_EXTERNAL: "true"
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml config >/dev/null

  regressions:
    name: Full container regressions
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run browser checks
        run: ./tests/browser/run.sh
      - name: Run compatibility checks
        run: ./tests/compatibility/run.sh
      - name: Run read-only runtime checks
        run: ./tests/runtime-readonly.sh
      - name: Run clean-install and restart smoke
        run: ./tests/release-smoke.sh
      - name: Run TLS reverse-proxy smoke
        run: ./tests/reverse-proxy-smoke.sh

  image:
    name: Publish multi-architecture image
    needs: regressions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set release metadata
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Refusing non-alpha/beta/rc or malformed release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Channel tag: alpha releases tag 'alpha', beta/rc tag 'beta'. 'latest'
          # always moves to the newest release (alpha or beta).
          if [[ "$GITHUB_REF_NAME" =~ -alpha\. ]]; then
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.channel }}
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TILLER_VERSION=${{ steps.release.outputs.version }}
            TILLER_COMMIT=${{ github.sha }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tiller Router $GITHUB_REF_NAME" --generate-notes
