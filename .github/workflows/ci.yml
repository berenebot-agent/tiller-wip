name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Each step tees its full output to ci-logs/ so the exact failure text is
      # downloadable as a build artifact (uploaded even on failure below). This
      # keeps CI on native Go and setup-go caching, while giving the same
      # "never re-run to see the full log" guarantee as ./tests/run.sh locally.
      - name: Check formatting
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "== gofmt =="
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "gofmt found unformatted files:"
              echo "$unformatted"
              echo "Fix locally with: ./tiller-go.sh fmt ./... (then re-run ./tests/scripts/check-fmt.sh)"
              exit 1
            fi
          } 2>&1 | tee ci-logs/gofmt.log
      # Tee-ing the output must not swallow a non-zero exit: without pipefail
      # the step reports tee's status (0) and a red test/vet/build merges green.
      - name: Test
        shell: bash
        run: go test ./... 2>&1 | tee ci-logs/test.log
      - name: Vet
        shell: bash
        run: go vet ./... 2>&1 | tee ci-logs/vet.log
      - name: Build
        shell: bash
        run: go build ./cmd/tiller-router 2>&1 | tee ci-logs/build.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      # Fail if the Compose files have invalid YAML, bad interpolation, or a
      # required variable without a safe dummy value. No container is started.
      - name: Validate docker-compose.yml
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate docker-compose.yml with legacy names
        env:
          TILLER_ADMIN_USERNAME: ci
          TILLER_ADMIN_PASSWORD: ci
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate hosted override with managed ingress network
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
          TILLER_PLATFORM_ADMIN_USERNAME: ci-platform
          TILLER_PLATFORM_ADMIN_PASSWORD: ci-platform-password
          TILLER_PUBLIC_URL: https://app.example.com
          TILLER_TRUSTED_PROXY: 172.20.0.2/32
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml config >/dev/null
      - name: Validate external proxy network override
        env:
          TILLER_USERNAME: ci
          TILLER_PASSWORD: ci
          TILLER_PLATFORM_ADMIN_USERNAME: ci-platform
          TILLER_PLATFORM_ADMIN_PASSWORD: ci-platform-password
          TILLER_INGRESS_NETWORK: ci-proxy-network
          TILLER_INGRESS_NETWORK_EXTERNAL: "true"
          TILLER_PUBLIC_URL: https://app.example.com
          TILLER_TRUSTED_PROXY: 172.20.0.2/32
        run: docker compose -f docker-compose.yml -f docker-compose.hosted.yml config >/dev/null

  container-regressions:
    name: Browser and runtime checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run browser checks
        run: ./tests/browser/run.sh
      - name: Run read-only runtime checks
        run: ./tests/runtime-readonly.sh
