# Project name pinned explicitly. Without this, Compose derives it from the
# directory basename — and since the gatehouse layout puts the checkout in
# repo/, both this project and gatehouse-mail resolve to the project name
# "repo". That makes each project see the other's containers as orphans, and
# `--remove-orphans` in one would tear down the other's live stack.
name: tiller-router

services:
  tiller-router:
    container_name: tiller-router
    build:
      context: .
      args:
        TILLER_UID: ${TILLER_UID:-65532}
        TILLER_GID: ${TILLER_GID:-65532}

    restart: unless-stopped

    environment:
      # Local operator credential. TILLER_USERNAME / TILLER_PASSWORD are the
      # current names. The legacy TILLER_ADMIN_USERNAME / TILLER_ADMIN_PASSWORD
      # are still honoured with a startup deprecation warning; the new names
      # win if both are set. See .env.example.
      TILLER_USERNAME: ${TILLER_USERNAME:-}
      TILLER_PASSWORD: ${TILLER_PASSWORD:-}
      TILLER_ADMIN_USERNAME: ${TILLER_ADMIN_USERNAME:-}
      TILLER_ADMIN_PASSWORD: ${TILLER_ADMIN_PASSWORD:-}

      # Hosted mode is opt-in. Leave unset for the existing local appliance.
      TILLER_MODE: ${TILLER_MODE:-local}
      TILLER_PUBLIC_URL: ${TILLER_PUBLIC_URL:-}
      TILLER_USER_SESSION_TTL: ${TILLER_USER_SESSION_TTL:-720h}

      # Force the admin session cookie's Secure attribute. Set to "true" when
      # serving the admin UI over HTTPS (behind a reverse proxy or with TLS at
      # the edge) so the cookie is only sent over secure connections. Defaults
      # to false; leave unset for plain-HTTP LAN access.
      TILLER_ADMIN_COOKIE_SECURE: ${TILLER_ADMIN_COOKIE_SECURE:-false}

      # The app starts as root and drops to the runtime user at boot, chown'ing
      # ./data to that user first — so a fresh ./data works with no `sudo chown`
      # step. TILLER_RUN_UID/TILLER_RUN_GID select the user the app runs as
      # (default 65532:65532, matching the image's build-time args). Leave unset
      # unless you need the data directory run as your own uid:gid.
      TILLER_RUN_UID: ${TILLER_RUN_UID:-65532}
      TILLER_RUN_GID: ${TILLER_RUN_GID:-65532}

      # Behind a reverse proxy (Caddy / Nginx / Traefik / etc.) that sets
      # X-Forwarded-For and Forwarded, set TILLER_TRUSTED_PROXY in .env to the
      # proxy's IP/CIDR so the router trusts the proxy-supplied client IP.
      # Leave unset to disable proxy-header trust.
      TILLER_TRUSTED_PROXY: ${TILLER_TRUSTED_PROXY:-}

      # Admin-only memory/pprof debug endpoints (GET /api/admin/debug/memory and
      # /api/admin/debug/pprof/*). Off by default; enable only while diagnosing.
      # Never leave enabled on an exposed deployment.
      TILLER_DEBUG_PPROF: ${TILLER_DEBUG_PPROF:-false}

      # In-memory auth-cache TTLs. Verified client keys/sessions are cached and
      # renewed on use; any key/session mutation invalidates immediately, so a
      # longer window only reduces hash-verification work. Defaults: client key
      # 15m, session 5m. Bounded to <=24h.
      TILLER_CLIENT_KEY_CACHE_TTL: ${TILLER_CLIENT_KEY_CACHE_TTL:-15m}
      TILLER_SESSION_CACHE_TTL: ${TILLER_SESSION_CACHE_TTL:-5m}

      # Optional one-time SMTP bootstrap. Hosted operators can change these
      # from the platform dashboard after startup; dashboard values win. API
      # providers (Resend, Brevo) are configured in the dashboard only.
      TILLER_MAIL_PROVIDER: ${TILLER_MAIL_PROVIDER:-}
      TILLER_MAIL_FROM: ${TILLER_MAIL_FROM:-}
      TILLER_MAIL_SMTP_HOST: ${TILLER_MAIL_SMTP_HOST:-}
      TILLER_MAIL_SMTP_PORT: ${TILLER_MAIL_SMTP_PORT:-}
      TILLER_MAIL_SMTP_MODE: ${TILLER_MAIL_SMTP_MODE:-}
      TILLER_MAIL_SMTP_USERNAME: ${TILLER_MAIL_SMTP_USERNAME:-}
      TILLER_MAIL_SMTP_PASSWORD: ${TILLER_MAIL_SMTP_PASSWORD:-}

      # Provider credentials, OAuth tokens, and webhook auth headers are encrypted
      # at rest (AES-256-GCM). Leave both unset and the app generates a key once at
      # ./data/master.key. Set TILLER_MASTER_KEY (base64 of 32 random bytes) or, for
      # stricter custody, TILLER_MASTER_KEY_FILE to a Docker secret path (takes
      # precedence). Back the key up separately from ./data.
      TILLER_MASTER_KEY: ${TILLER_MASTER_KEY:-}
      TILLER_MASTER_KEY_FILE: ${TILLER_MASTER_KEY_FILE:-}

    volumes:
      - ./data:/data
    # Default hardening (adoption-first posture). The image starts as root so
    # internal/privdrop can chown a fresh root-owned ./data and shed to the
    # runtime user before the database is opened. read_only + /tmp tmpfs +
    # no-new-privileges are compatible with that flow: the only filesystem
    # writes are under the bind-mounted ./data and under /tmp, and no setuid
    # binaries are exec'd after the drop.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/tiller-router", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 0.0.0.0:${TILLER_PORT:-8080}:8080

  # Hardenable, not required: for an internet-exposed deployment you may also
  # drop all capabilities and force a strict non-root user. These two are
  # opt-in because they conflict with the in-process root-then-drop: a strict
  # `user: ...` skips the boot chown and a fresh rootful-Docker ./data would
  # fail with ErrDataDirUnwritable, and `cap_drop: [ALL]` removes the
  # setuid/setgid/chown capabilities the drop requires.
  #
  # cap_drop: [ALL]
  # user: "${TILLER_RUN_UID:-65532}:${TILLER_RUN_GID:-65532}"
