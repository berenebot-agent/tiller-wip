# Hosted deployment override. Use with:
#
#   TILLER_TRUSTED_PROXY=172.20.0.2/32 docker compose -f docker-compose.yml -f docker-compose.hosted.yml up -d --build
#
# The base Compose file remains the simple self-hosted appliance. This override
# removes its direct host port and supplies the reverse-proxy network boundary.
services:
  tiller-router:
    environment:
      TILLER_MODE: hosted
      TILLER_PUBLIC_URL: ${TILLER_PUBLIC_URL:?set TILLER_PUBLIC_URL}
      TILLER_TRUSTED_PROXY: ${TILLER_TRUSTED_PROXY:?set TILLER_TRUSTED_PROXY to the reverse proxy IP or CIDR}
      TILLER_PLATFORM_ADMIN_USERNAME: ${TILLER_PLATFORM_ADMIN_USERNAME:?set TILLER_PLATFORM_ADMIN_USERNAME}
      TILLER_PLATFORM_ADMIN_PASSWORD: ${TILLER_PLATFORM_ADMIN_PASSWORD:?set TILLER_PLATFORM_ADMIN_PASSWORD}
      # Set these only when converting an existing local deployment. They are
      # consumed once to create the first hosted customer and then ignored.
      # TILLER_USERNAME / TILLER_PASSWORD are the current names; the legacy
      # TILLER_ADMIN_* aliases still work with a deprecation warning.
      TILLER_USERNAME: ${TILLER_USERNAME:-}
      TILLER_PASSWORD: ${TILLER_PASSWORD:-}
      TILLER_ADMIN_USERNAME: ${TILLER_ADMIN_USERNAME:-}
      TILLER_ADMIN_PASSWORD: ${TILLER_ADMIN_PASSWORD:-}
    ports: !reset []
    expose:
      - "8080"
    networks:
      - ingress
      - egress

networks:
  # A same-project reverse proxy can join this network as `ingress`. A proxy
  # in another Compose project can use an existing network by setting both
  # TILLER_INGRESS_NETWORK and TILLER_INGRESS_NETWORK_EXTERNAL=true.
  ingress:
    name: ${TILLER_INGRESS_NETWORK:-tiller-router-ingress}
    external: ${TILLER_INGRESS_NETWORK_EXTERNAL:-false}
  # Deliberately managed by this project and contains only Tiller.
  egress:
    name: tiller-router-egress
