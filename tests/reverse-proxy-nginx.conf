events {}

http {
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        location / {
            proxy_pass http://router:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Overwrite (never forward) an inbound X-Real-IP. Tiller no longer
            # consults this header for security decisions, but setting it here
            # keeps the edge from passing a client-chosen value upstream to any
            # other component that might.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
        }
    }

    # Local deterministic upstream used to exercise client SSE through both
    # Tiller and the TLS reverse proxy without external provider credentials.
    server {
        listen 8081;

        location = /v1/models {
            default_type application/json;
            return 200 '{"object":"list","data":[{"id":"mock-model"}]}';
        }

        location = /v1/chat/completions {
            default_type text/event-stream;
            add_header Cache-Control no-cache;
            return 200 'data: {"id":"chatcmpl_proxy","object":"chat.completion.chunk","model":"mock-model","choices":[{"index":0,"delta":{"content":"hello"},"finish_reason":null}]}

data: [DONE]

';
        }
    }
}
